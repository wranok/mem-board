[package]
name = "mem-board"
version = "0.1.0"
edition = "2024"

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_22"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_9"] }
gdk-pixbuf = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
